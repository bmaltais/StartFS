name: ci

# Checked once, on the pull request. Merging, the release commit and the tag do not
# re-run it; run it by hand from the Actions tab if a direct push to main needs it.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install FUSE headers
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3 pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: scripts/check-helpers.sh
      - run: scripts/test-install.sh
