name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install FUSE headers
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3 pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The macOS adapter has never been run; this only shows whether it still builds.
  macos-build:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FUSE-T
        run: |
          brew tap macos-fuse-t/homebrew-cask
          brew install --cask fuse-t
          brew install pkg-config
          # fuser asks pkg-config for `fuse`; FUSE-T only ships fuse-t.pc and fuse3.pc.
          cat /usr/local/lib/pkgconfig/fuse-t.pc
          sudo cp /usr/local/lib/pkgconfig/fuse-t.pc /usr/local/lib/pkgconfig/fuse.pc
      - uses: Swatinem/rust-cache@v2
      - run: PKG_CONFIG_PATH=/usr/local/lib/pkgconfig cargo build --locked -p startfs
