name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install FUSE headers
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3 pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  # The macOS adapter has never been run; this only shows whether it still builds.
  macos-build:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FUSE-T
        run: |
          brew tap macos-fuse-t/homebrew-cask
          brew install --cask fuse-t
          brew install pkg-config
          # fuser asks pkg-config for `fuse >= 2.6.0`; FUSE-T ships fuse-t.pc (version 1.x).
          printf '%s\n' 'libdir=/usr/local/lib' 'Name: fuse' 'Description: FUSE-T as libfuse 2' \
            'Version: 2.9.9' 'Libs: -L${libdir} -Wl,-rpath,${libdir} -lfuse-t' \
            'Cflags: -I/usr/local/include/fuse' | sudo tee /usr/local/lib/pkgconfig/fuse.pc
      - uses: Swatinem/rust-cache@v2
      - run: PKG_CONFIG_PATH=/usr/local/lib/pkgconfig cargo build --locked -p startfs
