name: macos-build

# Runs after `ci` passes on main, never alongside it. The macOS adapter has never been
# run; this only shows whether it still compiles.
on:
  workflow_run:
    workflows: [ci]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  macos-build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - run: scripts/macos-fuse-t.sh
      - uses: Swatinem/rust-cache@v2
      - run: PKG_CONFIG_PATH=/usr/local/lib/pkgconfig cargo build --locked -p startfs
