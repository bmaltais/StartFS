name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-22.04
          - target: aarch64-linux
            runner: ubuntu-22.04-arm
          # The macOS adapter has never been run (see README); a failed build here
          # must not block the Linux release.
          - target: aarch64-macos
            runner: macos-14
            experimental: true
    # Oldest LTS runner, so the binary runs on any newer glibc.
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FUSE-T
        if: runner.os == 'macOS'
        run: scripts/macos-fuse-t.sh
      - name: Install FUSE headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3 pkg-config
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches the crate version
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="startfs"))')
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != crate version v$v"; exit 1; }
      - run: cargo build --release --locked -p startfs
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
      - name: Package
        run: |
          name="startfs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/startfs README.md "$name/"
          if [ "$RUNNER_OS" = macOS ]; then
            cp dist/com.startfs.daemon.plist "$name/"
            cp dist/README.md "$name/MACOS.md"
          else
            cp dist/startfs.service "$name/"
          fi
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: startfs-*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag startfs-*
