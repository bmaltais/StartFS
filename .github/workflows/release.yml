name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-linux
            runner: ubuntu-22.04
          - target: aarch64-linux
            runner: ubuntu-22.04-arm
    # Oldest LTS runner, so the binary runs on any newer glibc.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install FUSE headers
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev fuse3 pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p startfs
      - name: Package
        run: |
          name="startfs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/startfs README.md dist/startfs.service "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: startfs-*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag startfs-*
